<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MKV Sales Dashboard</title>
<style>
  :root{
    --navy:#1B1F3B;
    --navy-dark:#12152A;
    --gold:#C9A227;
    --gold-light:#E8C96E;
    --cream:#F7F3EA;
    --white:#FFFFFF;
    --gray-text:#4A4A4A;
    --soft-gray:#EDEDF2;
    --green:#3E7D5C;
    --green-bg:#E9F2ED;
    --red:#B04A3B;
    --red-bg:#F3E7E4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Calibri, "Segoe UI", Arial, sans-serif;
    background:var(--cream);
    color:var(--gray-text);
  }
  .dashboard{
    max-width:1300px;
    margin:0 auto;
    padding-bottom:40px;
  }
  header{
    background:var(--navy);
    color:var(--white);
    padding:22px 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-family:Cambria, "Times New Roman", serif;
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:0.5px;
  }
  header .sub{
    color:var(--gold-light);
    font-style:italic;
    font-size:13px;
  }
  .kpi-row{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:14px;
    padding:24px 32px 0 32px;
  }
  .kpi-card{
    background:var(--white);
    border-radius:10px;
    padding:16px 10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .kpi-card .value{
    font-family:Cambria, serif;
    font-size:28px;
    font-weight:700;
    color:var(--navy);
  }
  .kpi-card .value.gold{ color:var(--gold); }
  .kpi-card .value.sell{ }
  .kpi-card .label{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.6px;
    color:var(--gray-text);
    margin-top:6px;
    text-transform:uppercase;
  }
  .main-grid{
    display:grid;
    grid-template-columns:1.65fr 1fr;
    gap:24px;
    padding:28px 32px 0 32px;
  }
  .panel-title{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 12px 0;
  }
  .chart-card{
    background:transparent;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:14px;
    height:280px;
    border-bottom:1px solid #ccc;
    padding:0 4px;
    position:relative;
  }
  .bars .gridline{
    position:absolute;
    left:0; right:0;
    border-top:1px solid #e3e3e3;
  }
  .bar-group{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:4px;
    height:100%;
    position:relative;
    z-index:1;
  }
  .bar{
    width:40%;
    position:relative;
    border-radius:2px 2px 0 0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .bar.sales{ background:var(--gold); }
  .bar.memo{ background:var(--navy); }
  .bar .val{
    position:absolute;
    top:-18px;
    font-size:10.5px;
    color:#333;
    font-weight:600;
    white-space:nowrap;
  }
  .bar-labels{
    display:flex;
    gap:14px;
    padding:0 4px;
    margin-top:8px;
  }
  .bar-labels div{
    flex:1;
    text-align:center;
    font-size:10.5px;
    color:var(--gray-text);
  }
  .legend{
    display:flex;
    gap:20px;
    justify-content:center;
    margin-top:16px;
    font-size:11px;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .swatch{
    width:11px; height:11px; border-radius:2px; display:inline-block;
  }
  .callouts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:28px;
  }
  .callout{
    border-radius:10px;
    padding:16px 18px;
  }
  .callout.top{ background:var(--green-bg); }
  .callout.low{ background:var(--red-bg); }
  .callout .tag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .callout.top .tag{ color:var(--green); }
  .callout.low .tag{ color:var(--red); }
  .callout .name{
    font-family:Cambria, serif;
    font-size:19px;
    font-weight:700;
    color:var(--navy);
    margin-top:6px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  thead th{
    background:var(--navy);
    color:var(--white);
    font-size:11px;
    text-align:center;
    padding:9px 6px;
  }
  thead th:first-child{ text-align:left; padding-left:12px; }
  tbody td{
    padding:10px 6px;
    font-size:12px;
    text-align:center;
    border-bottom:1px solid #eee;
  }
  tbody tr:nth-child(even){ background:var(--soft-gray); }
  tbody td:first-child{
    text-align:left;
    padding-left:10px;
    font-weight:700;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-wrap{
    width:26px; height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  td.sales-val{ color:var(--gold); font-weight:700; }
  .sell-pct{ font-weight:700; }
  .sell-pct.green{ color:var(--green); }
  .sell-pct.gold{ color:var(--gold); }
  .sell-pct.red{ color:var(--red); }
  .footnote{
    font-size:10px;
    font-style:italic;
    color:#8A8A8A;
    margin-top:10px;
  }
  footer{
    display:flex;
    justify-content:space-between;
    padding:24px 32px 0 32px;
    font-size:10.5px;
    color:#9A9A9A;
  }
</style>
</head>
<body>
<div class="dashboard">
  <header>
    <h1>MKV SALES DASHBOARD</h1>
    <div class="sub">Data through 14th July 2026</div>
  </header>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="main-grid">
    <div>
      <div class="chart-card">
        <p class="panel-title">Total Sales Qty vs Current Open Memo — by Band Shape</p>
        <div class="bars" id="barsChart"></div>
        <div class="bar-labels" id="barLabels"></div>
        <div class="legend">
          <span><span class="swatch" style="background:var(--gold)"></span>Total Sales Qty</span>
          <span><span class="swatch" style="background:var(--navy)"></span>Current Open Memo</span>
        </div>
      </div>
      <div class="callouts" id="callouts"></div>
    </div>

    <div>
      <p class="panel-title">Band Shape Breakdown</p>
      <table>
        <thead>
          <tr><th>Band Shape</th><th>SKUs</th><th>Sales</th><th>Memo</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="footnote">Sell-through = Sales Qty ÷ (Sales Qty + Open Memo)</div>
    </div>
  </div>

  <footer>
    <span>MKV Sales Summary Report | Executive Dashboard</span>
    <span>Page 1</span>
  </footer>
</div>

<script>
const groups = {
  "Radiant Band": [{"sku":"MV040-W","total":7,"memo":7},{"sku":"MV040-Y","total":3,"memo":8}],
  "Oval Band": [{"sku":"MV041-W","total":6,"memo":6},{"sku":"MV041-Y","total":11,"memo":7},{"sku":"MV053-W","total":4,"memo":10},{"sku":"MV053-Y","total":4,"memo":10}],
  "Pear Band": [{"sku":"MV042-W","total":11,"memo":7},{"sku":"MV042-Y","total":21,"memo":8},{"sku":"MV051-W","total":14,"memo":6},{"sku":"MV051-Y","total":4,"memo":8}],
  "Baguette Band": [{"sku":"MV043-W","total":0,"memo":9},{"sku":"MV043-Y","total":60,"memo":8}],
  "Round Band": [{"sku":"MV044-W","total":0,"memo":15},{"sku":"MV044-Y","total":4,"memo":14},{"sku":"MV045-W","total":2,"memo":13},{"sku":"MV045-Y","total":4,"memo":15},{"sku":"MV046-W","total":6,"memo":14},{"sku":"MV046-Y","total":3,"memo":15},{"sku":"MV047-W","total":2,"memo":15},{"sku":"MV047-Y","total":2,"memo":14},{"sku":"MV048-W","total":8,"memo":12},{"sku":"MV048-Y","total":6,"memo":15},{"sku":"MV055-W","total":0,"memo":10},{"sku":"MV055-Y","total":1,"memo":9}],
  "Emerald Band": [{"sku":"MV049-W","total":0,"memo":8},{"sku":"MV049-Y","total":2,"memo":8},{"sku":"MV052-W","total":1,"memo":8},{"sku":"MV052-Y","total":4,"memo":7},{"sku":"MV054-W","total":2,"memo":10},{"sku":"MV054-Y","total":2,"memo":10}],
  "Marquise Band": [{"sku":"MV050-W","total":3,"memo":7},{"sku":"MV050-Y","total":5,"memo":5}]
};
const order = ["Radiant Band","Oval Band","Pear Band","Baguette Band","Round Band","Emerald Band","Marquise Band"];

const GOLD = "#C9A227", GOLD_LIGHT="#E8C96E";

function shapeIcon(shape, size){
  const s = size || 26;
  const stroke = GOLD;
  switch(shape){
    case "Radiant Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><polygon points="30,10 70,10 90,30 90,70 70,90 30,90 10,70 10,30" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="30" y1="10" x2="70" y2="90" stroke="${GOLD_LIGHT}" stroke-width="1.5"/><line x1="70" y1="10" x2="30" y2="90" stroke="${GOLD_LIGHT}" stroke-width="1.5"/><line x1="10" y1="30" x2="90" y2="70" stroke="${GOLD_LIGHT}" stroke-width="1.5"/><line x1="10" y1="70" x2="90" y2="30" stroke="${GOLD_LIGHT}" stroke-width="1.5"/></svg>`;
    case "Oval Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="30" ry="40" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="50" y1="10" x2="50" y2="90" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="20" y1="50" x2="80" y2="50" stroke="${GOLD_LIGHT}" stroke-width="1.2"/></svg>`;
    case "Pear Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 8 C 68 32, 88 42, 88 62 C 88 80, 71 92, 50 92 C 29 92, 12 80, 12 62 C 12 42, 32 32, 50 8 Z" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="50" y1="8" x2="50" y2="60" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="50" y1="60" x2="20" y2="55" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="50" y1="60" x2="80" y2="55" stroke="${GOLD_LIGHT}" stroke-width="1.2"/></svg>`;
    case "Baguette Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect x="30" y="8" width="40" height="84" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="30" y1="36" x2="70" y2="36" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="30" y1="64" x2="70" y2="64" stroke="${GOLD_LIGHT}" stroke-width="1.2"/></svg>`;
    case "Round Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="50" y1="12" x2="50" y2="88" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="12" y1="50" x2="88" y2="50" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="21" y1="21" x2="79" y2="79" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="79" y1="21" x2="21" y2="79" stroke="${GOLD_LIGHT}" stroke-width="1.2"/></svg>`;
    case "Emerald Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><polygon points="32,8 68,8 92,26 92,74 68,92 32,92 8,74 8,26" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="32" y1="8" x2="68" y2="92" stroke="${GOLD_LIGHT}" stroke-width="1.2"/><line x1="68" y1="8" x2="32" y2="92" stroke="${GOLD_LIGHT}" stroke-width="1.2"/></svg>`;
    case "Marquise Band":
      return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 8 C 70 30, 70 30, 78 50 C 70 70, 70 70, 50 92 C 30 70, 30 70, 22 50 C 30 30, 30 30, 50 8 Z" fill="none" stroke="${stroke}" stroke-width="6"/><line x1="50" y1="8" x2="50" y2="92" stroke="${GOLD_LIGHT}" stroke-width="1.2"/></svg>`;
    default:
      return "";
  }
}

const shapeStats = order.map(shape=>{
  const rows = groups[shape];
  const sales = rows.reduce((a,r)=>a+r.total,0);
  const memo = rows.reduce((a,r)=>a+r.memo,0);
  const sellThrough = (sales+memo)>0 ? (sales/(sales+memo))*100 : 0;
  return {shape, skuCount: rows.length, sales, memo, sellThrough};
});

const grandSales = shapeStats.reduce((a,s)=>a+s.sales,0);
const grandMemo = shapeStats.reduce((a,s)=>a+s.memo,0);
const grandSKU = shapeStats.reduce((a,s)=>a+s.skuCount,0);
const overallSellThrough = Math.round((grandSales/(grandSales+grandMemo))*1000)/10;
const best = [...shapeStats].sort((a,b)=>b.sellThrough-a.sellThrough)[0];
const worst = [...shapeStats].sort((a,b)=>a.sellThrough-b.sellThrough)[0];

function sellColor(pct){
  if(pct>=30) return "green";
  if(pct>=15) return "gold";
  return "red";
}
function sellColorHex(pct){
  if(pct>=30) return "#3E7D5C";
  if(pct>=15) return "#C9A227";
  return "#B04A3B";
}

// KPI row
const kpis = [
  {label:"TOTAL SALES QTY", value:grandSales, cls:"gold"},
  {label:"CURRENT OPEN MEMO", value:grandMemo, cls:""},
  {label:"OVERALL SELL-THROUGH", value:overallSellThrough+"%", cls:"", color:sellColorHex(overallSellThrough)},
  {label:"SKU COUNT", value:grandSKU, cls:""},
  {label:"BAND STYLES", value:order.length, cls:""}
];
document.getElementById("kpiRow").innerHTML = kpis.map(k=>`
  <div class="kpi-card">
    <div class="value ${k.cls}" style="${k.color? 'color:'+k.color+';':''}">${k.value}</div>
    <div class="label">${k.label}</div>
  </div>
`).join("");

// Bar chart
const maxVal = Math.max(...shapeStats.map(s=>Math.max(s.sales,s.memo)));
const chartHeight = 260;
document.getElementById("barsChart").innerHTML =
  [20,40,60,80,100].map(p=>`<div class="gridline" style="bottom:${p}%"></div>`).join("") +
  shapeStats.map(s=>{
    const salesH = (s.sales/maxVal*chartHeight);
    const memoH = (s.memo/maxVal*chartHeight);
    return `<div class="bar-group">
      <div class="bar sales" style="height:${salesH}px"><span class="val">${s.sales}</span></div>
      <div class="bar memo" style="height:${memoH}px"><span class="val">${s.memo}</span></div>
    </div>`;
  }).join("");

document.getElementById("barLabels").innerHTML = shapeStats.map(s=>`<div>${s.shape}</div>`).join("");

// Callouts
document.getElementById("callouts").innerHTML = `
  <div class="callout top">
    <div class="tag">Top Sell-Through</div>
    <div class="name">${best.shape} — ${Math.round(best.sellThrough*10)/10}%</div>
  </div>
  <div class="callout low">
    <div class="tag">Lowest Sell-Through</div>
    <div class="name">${worst.shape} — ${Math.round(worst.sellThrough*10)/10}%</div>
  </div>
`;

// Table
document.getElementById("tableBody").innerHTML = shapeStats.map(row=>{
  const pct = Math.round(row.sellThrough*10)/10;
  return `<tr>
    <td><span class="icon-wrap">${shapeIcon(row.shape,26)}</span>${row.shape.replace(" Band","")}</td>
    <td>${row.skuCount}</td>
    <td class="sales-val">${row.sales}</td>
    <td>${row.memo} &nbsp;<span class="sell-pct ${sellColor(pct)}">${pct}%</span></td>
  </tr>`;
}).join("");
</script>
</body>
</html>
